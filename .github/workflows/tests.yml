name: Local pilot verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [cpu, video]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified vendor ref
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python scripts/setup_environment.py --directory .venv-ci --dev ${{ matrix.profile == 'video' && '--video' || '' }}
      - run: ${{ runner.os == 'Windows' && '.venv-ci/Scripts/python.exe' || '.venv-ci/bin/python' }} scripts/check_quality.py --output var/quality
      - name: Verify tracked source was preserved during tests
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.profile }}
          path: var/quality
  image-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record source hashes
        run: git ls-files -z | xargs -0 sha256sum > source.sha256
      - name: Build and verify isolated Linux tests
        run: |
          docker build --target video-test -t coffee-ops-tests .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges coffee-ops-tests
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges coffee-ops-tests python scripts/verify_egress.py
      - name: Verify the RT-DETR runtime profile
        run: |
          docker build -f Dockerfile.permissive --target test -t coffee-ops-rtdetr-tests .
          mkdir -p var/permissive-ci
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 3g --user "$(id -u):$(id -g)" --mount type=bind,source="$PWD/var/permissive-ci",target=/app/var coffee-ops-rtdetr-tests python scripts/check_quality.py --output /app/var/quality
      - name: Build and record runtime artifact
        run: |
          docker build -f Dockerfile.permissive --target production -t coffee-ops-runtime .
          docker image inspect coffee-ops-runtime > image-metadata.json
          docker image save --output runtime.tar coffee-ops-runtime
          sha256sum runtime.tar > runtime.tar.sha256
          python scripts/verify_container.py --image coffee-ops-runtime --backend rtdetr_v2 --output container-check.json
      - name: Inventory dependency licenses
        run: |
          docker run --rm --network none coffee-ops-runtime python -c 'import importlib.metadata as m,json; print(json.dumps([{"name":d.metadata["Name"],"version":d.version,"license":d.metadata.get("License-Expression") or d.metadata.get("License") or "UNKNOWN"} for d in m.distributions()],indent=2))' > licenses.json
      - name: Install verified scanner release
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o trivy.tar.gz
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz' | sha256sum -c
          mkdir trivy-tool
          tar -xzf trivy.tar.gz -C trivy-tool trivy
      - name: Complete OS and Python scan and SBOM
        run: |
          trivy-tool/trivy image --input runtime.tar --scanners vuln --list-all-pkgs --format json --output trivy.json --timeout 15m --no-progress
          trivy-tool/trivy convert --format cyclonedx --output sbom.cdx.json trivy.json
      - name: Reject all unresolved high or critical matches
        run: python -c 'import json,sys; r=json.load(open("trivy.json")); v=[v for r in r["Results"] for v in (r.get("Vulnerabilities") or []) if v["Severity"] in {"HIGH","CRITICAL"}]; print(len(v),"high/critical matches"); sys.exit(bool(v))'
      - name: Require an owner-selected source license
        if: always()
        run: test -f LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-evidence
          path: |
            source.sha256
            image-metadata.json
            runtime.tar.sha256
            licenses.json
            trivy.json
            sbom.cdx.json
            container-check.json
            var/permissive-ci
